name: Notify PR Opened

on:
  pull_request:
    types:
      - opened
      - reopened
      - ready_for_review
      - converted_to_draft

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Post Telegram notification
        continue-on-error: true
        run: |
          # PR fields (title, branch, author) are user-controlled, so HTML-escape
          # &, < and > before embedding them in an HTML-parse-mode message.
          # Newlines are literal here; --data-urlencode encodes the whole body
          # (including the escaped & entities), so nothing breaks the form.
          esc() { printf '%s' "$1" | sed -e 's/&/\&amp;/g' -e 's/</\&lt;/g' -e 's/>/\&gt;/g'; }

          AUTHOR=$(esc "${PR_AUTHOR}")
          TITLE=$(esc "${PR_TITLE}")
          HEAD=$(esc "${PR_HEAD}")
          BASE=$(esc "${PR_BASE}")

          # Header reflects whether the PR is a draft or ready for review.
          if [ "${IS_DRAFT}" = "true" ]; then
            HEADER="📝 <b>New draft pull request</b>"
          else
            HEADER="🔔 <b>New pull request</b>"
          fi

          message=$(cat <<EOF
          ${HEADER} #${PR_NUMBER} in <b>${REPO}</b>
          <b>${TITLE}</b>
          👤 by <i>${AUTHOR}</i>
          🔀 <code>${HEAD}</code> → <code>${BASE}</code>
          📝 ${CHANGED} changed file(s), +${ADDITIONS} −${DELETIONS}
          <a href="${PR_URL}">View pull request</a>
          EOF
          )

          curl -s -X POST "https://api.telegram.org/bot${{ vars.NOTIFICATIONS_TOKEN }}/sendMessage" \
            --data-urlencode "chat_id=${{ vars.NOTIFICATIONS_TO }}" \
            --data-urlencode "message_thread_id=2" \
            --data-urlencode "parse_mode=HTML" \
            --data-urlencode "disable_web_page_preview=true" \
            --data-urlencode "text=${message}"
        env:
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          PR_HEAD: ${{ github.event.pull_request.head.ref }}
          PR_BASE: ${{ github.event.pull_request.base.ref }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          CHANGED: ${{ github.event.pull_request.changed_files }}
          ADDITIONS: ${{ github.event.pull_request.additions }}
          DELETIONS: ${{ github.event.pull_request.deletions }}
          IS_DRAFT: ${{ github.event.pull_request.draft }}
